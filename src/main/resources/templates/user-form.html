<!DOCTYPE html>
<html lang="en"
      xmlns:th="http://www.thymeleaf.org"
      xmlns:sec="http://www.thymeleaf.org/extras/spring-security">
<head>
    <meta charset="UTF-8">
    <title>User Form</title>
    <link rel="stylesheet" th:href="@{/css/bootstrap.min.css}">
    <link rel="stylesheet" th:href="@{/css/style.css}">
</head>
<body>

<script th:src="@{/js/bootstrap.bundle.min.js}"></script>

<div th:replace="~{fragments/header :: header}"></div>

<main class="app-content">
    <div th:replace="~{fragments/messages :: messages}"></div>

    <div>
        <h1 th:text="${userId} != null ? 'Edit User' : 'Add User'">User Form</h1>

        <form th:action="${userId} != null ? @{/users/edit/{id}(id=${userId})} : @{/users/new}"
              th:object="${user}"
              method="post">

            <p>
                <label>Username:</label>
                <input type="text" th:field="*{username}">
            </p>

            <p>
                <label>Password:</label>
                <input type="password"
                       th:field="*{password}"
                       th:placeholder="${userId} != null ? 'Leave blank to keep current password' : 'Password'">
            </p>

            <p>
                <label>First Name:</label>
                <input type="text" th:field="*{firstName}">
            </p>

            <p>
                <label>Last Name:</label>
                <input type="text" th:field="*{lastName}">
            </p>

            <p>
                <label>Email:</label>
                <input type="email" th:field="*{email}">
            </p>

            <p sec:authorize="hasRole('ADMINISTRATOR')">
                <label>Active:</label>
                <input type="checkbox" th:field="*{activeStatus}">
            </p>

            <button type="submit" class="btn btn-primary">Save</button>

        </form>
    </div>
    <div th:if="*{member != null}">
        <h3>Membership Information</h3>

        <p>
            <label>Phone:</label>
            <input type="number" th:field="*{member.phoneNumber}">
        </p>

        <p>
            <label>Address:</label>
            <input type="text" th:field="*{member.address}">
        </p>

        <p>
            <label>Expiration Date:</label>
            <input type="datetime-local"
                   th:field="*{member.expirationDate}">
        </p>

        <p>
            <label>Maximum Loans:</label>
            <input type="number" th:field="*{member.maxLoans}">
        </p>

        <p sec:authorize="hasRole('ADMINISTRATOR')">
            <label>Status:</label>
            <select th:field="*{member.status}">
                <option th:each="status : ${T(library.management.librarymanagement.model.enums.MembershipStatus).values()}"
                        th:value="${status}"
                        th:text="${status}">
                </option>
            </select>
        </p>
    </div>
</main>

<div th:replace="~{fragments/footer :: footer}"></div>

</body>
</html>
