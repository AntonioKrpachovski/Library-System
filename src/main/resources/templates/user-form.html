<!DOCTYPE html>
<html lang="en"
      xmlns:th="http://www.thymeleaf.org"
      xmlns:sec="http://www.thymeleaf.org/extras/spring-security">
<head>
    <meta charset="UTF-8">
    <title>User Form</title>
    <link rel="stylesheet" th:href="@{/css/bootstrap.min.css}">
    <link rel="stylesheet" th:href="@{/css/style.css}">
</head>
<body>

<script th:src="@{/js/bootstrap.bundle.min.js}"></script>

<div th:replace="~{fragments/header :: header}"></div>

<main class="app-content">
    <div th:replace="~{fragments/messages :: messages}"></div>

    <div>
        <h1 th:text="${userId} != null ? 'Edit User' : 'Add User'">User Form</h1>

        <form th:with="actionUrl=${userId != null ? '/users/edit/' + userId : '/users/new'}"
              th:action="@{${actionUrl}}"
              th:object="${user}"
              method="post">

            <p>
                <label>Username:</label>
                <input type="text" th:field="*{username}">
                <span class="text-danger" th:if="${#fields.hasErrors('username')}" th:errors="*{username}"></span>
            </p>

            <p>
                <label>First Name:</label>
                <input type="text" th:field="*{firstName}">
                <span class="text-danger" th:if="${#fields.hasErrors('firstName')}" th:errors="*{firstName}"></span>
            </p>

            <p>
                <label>Last Name:</label>
                <input type="text" th:field="*{lastName}">
                <span class="text-danger" th:if="${#fields.hasErrors('lastName')}" th:errors="*{lastName}"></span>
            </p>

            <p>
                <label>Email:</label>
                <input type="email" th:field="*{email}">
                <span class="text-danger" th:if="${#fields.hasErrors('email')}" th:errors="*{email}"></span>
            </p>

            <p th:if="${userId} == null">
                <label>Password:</label>
                <input type="password" th:field="*{password}">
                <span class="text-danger" th:if="${#fields.hasErrors('password')}" th:errors="*{password}"></span>
            </p>

            <p th:if="${userId} == null">
                <label>Role:</label>
                <select id="roleSelect" th:field="*{role}">
                    <option th:each="r : ${T(library.management.librarymanagement.model.enums.UserRole).values()}"
                            th:value="${r}"
                            th:text="${r}">
                    </option>
                </select>
                <span class="text-danger" th:if="${#fields.hasErrors('role')}" th:errors="*{role}"></span>
            </p>

            <p sec:authorize="hasRole('ADMINISTRATOR')">
                <label>Active:</label>
                <input type="checkbox" th:field="*{activeStatus}">
            </p>

            <div id="memberFields" th:if="${userId} == null or *{member} != null">
                <h3>Membership Information</h3>

                <p>
                    <label>Phone:</label>
                    <input type="text" inputmode="numeric" pattern="[0-9]*" th:field="*{member.phoneNumber}">
                </p>

                <p>
                    <label>Address:</label>
                    <input type="text" th:field="*{member.address}">
                </p>

                <p>
                    <label>Expiration Date:</label>
                    <input type="datetime-local"
                           th:field="*{member.expirationDate}">
                </p>

                <p>
                    <label>Maximum Loans:</label>
                    <input type="number" th:field="*{member.maxLoans}">
                </p>

                <p th:if="${userId} != null" sec:authorize="hasRole('ADMINISTRATOR')">
                    <label>Status:</label>
                    <select th:field="*{member.status}">
                        <option th:each="status : ${T(library.management.librarymanagement.model.enums.MembershipStatus).values()}"
                                th:value="${status}"
                                th:text="${status}">
                        </option>
                    </select>
                </p>
            </div>

            <button type="submit" class="btn btn-primary">Save</button>

        </form>
    </div>

</main>

<div th:replace="~{fragments/footer :: footer}"></div>

<script>
    document.addEventListener('DOMContentLoaded', function () {
        var roleSelect = document.getElementById('roleSelect');
        var memberFields = document.getElementById('memberFields');

        if (roleSelect && memberFields) {
            function toggleMemberFields() {
                memberFields.style.display = roleSelect.value === 'MEMBER' ? '' : 'none';
            }

            roleSelect.addEventListener('change', toggleMemberFields);
            toggleMemberFields();
        }
    });
</script>

</body>
</html>
