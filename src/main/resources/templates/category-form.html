<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Title</title>
</head>
<body>
<div th:replace="~{fragments/header :: header}"></div>
<div th:replace="~{fragments/nav :: nav}"></div>
<main class="app-content">
    <div th:replace="~{fragments/messages :: messages}"></div>
    <div>
        <h1 th:text="${categoryId} != null ? 'Edit Category' : 'Add Category'">Category Form</h1>

        <form th:action="${categoryId} != null ? @{/categories/{id}/edit(id=${categoryId})} : @{/categories/new}"
              th:object="${category}" method="post">
            <p>
                <label>Name:</label>
                <input type="text" th:field="*{name}" />
            </p>
            <p>
                <label>Description:</label>
                <textarea th:field="*{description}"></textarea>
            </p>
            <p>
                <label>Category Type:</label>
                <select th:field="*{categoryType}">
                    <option th:each="type : ${categoryTypes}" th:value="${type}" th:text="${type}"></option>
                </select>
            </p>
            <p>
                <label>Active:</label>
                <input type="checkbox" th:field="*{status}" />
            </p>
            <button type="submit">Save</button>
        </form>
    </div>
</main>
<div th:replace="~{fragments/footer :: footer}"></div>
</body>
</html>
