<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Title</title>
</head>
<body>
<div th:replace="~{fragments/header :: header}"></div>
<div th:replace="~{fragments/nav :: nav}"></div>
<main class="app-content">
    <div th:replace="~{fragments/messages :: messages}"></div>
    <div>
        <h1 th:text="${copyId} != null ? 'Edit Book Copy' : 'Add Book Copy'">Book Copy Form</h1>
        <p>Book: <span th:text="${book.title}">Book Title</span></p>

        <form th:action="${copyId} != null ? @{/book-copies/{id}/edit(id=${copyId})} : @{/books/{id}/copies/new(id=${book.id})}"
              th:object="${copy}" method="post">
            <p>
                <label>Inventory Number:</label>
                <input type="text" th:field="*{inventoryNumber}" />
            </p>
            <p>
                <label>Status:</label>
                <select th:field="*{currentStatus}">
                    <option th:each="s : ${statuses}" th:value="${s}" th:text="${s}"></option>
                </select>
            </p>
            <p>
                <label>Shelf Location:</label>
                <input type="text" th:field="*{shelfLocation}" />
            </p>
            <p>
                <label>Acquisition Date:</label>
                <input type="date" th:field="*{acquisitionDate}" />
            </p>
            <p>
                <label>Condition Notes:</label>
                <textarea th:field="*{conditionNotes}"></textarea>
            </p>
            <button type="submit">Save</button>
        </form>
    </div>
</main>
<div th:replace="~{fragments/footer :: footer}"></div>
</body>
</html>
