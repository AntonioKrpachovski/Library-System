<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org" xmlns:sec="http://www.thymeleaf.org/extras/spring-security">
<head>
    <meta charset="UTF-8">
    <title>Title</title>
    <link rel="stylesheet" th:href="@{/css/bootstrap.min.css}">
    <link rel="stylesheet" th:href="@{/css/style.css}">
</head>
<body>
<script th:src="@{/js/bootstrap.bundle.min.js}"></script>
<div th:replace="~{fragments/header :: header}"></div>
<main class="app-content">
    <div th:replace="~{fragments/messages :: messages}"></div>
    <div>
        <h1 th:text="${copyId} != null ? 'Edit Book Copy' : 'Add Book Copy'">Book Copy Form</h1>
        <p>Book: <span th:text="${book.title}">Book Title</span></p>

        <form th:with="actionUrl=${copyId != null ? '/book-copies/' + copyId + '/edit' : '/books/' + book.id + '/copies/new'}"
              th:action="@{${actionUrl}}"
              th:object="${copy}" method="post">
            <p>
                <label>Inventory Number:</label>
                <input type="text" th:field="*{inventoryNumber}" />
                <span class="text-danger" th:if="${#fields.hasErrors('inventoryNumber')}" th:errors="*{inventoryNumber}"></span>
            </p>
            <p>
                <label>Status:</label>
                <select th:field="*{currentStatus}">
                    <option th:each="s : ${statuses}" th:value="${s}" th:text="${s}"></option>
                </select>
                <span class="text-danger" th:if="${#fields.hasErrors('currentStatus')}" th:errors="*{currentStatus}"></span>
            </p>
            <p>
                <label>Shelf Location:</label>
                <input type="text" th:field="*{shelfLocation}" />
            </p>
            <p>
                <label>Acquisition Date:</label>
                <input type="date" th:field="*{acquisitionDate}" />
            </p>
            <p>
                <label>Condition Notes:</label>
                <textarea th:field="*{conditionNotes}"></textarea>
            </p>
            <button type="submit">Save</button>
        </form>
    </div>
</main>
<div th:replace="~{fragments/footer :: footer}"></div>
</body>
</html>
