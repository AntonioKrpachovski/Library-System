<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Book Details</title>
</head>
<body>

<div th:replace="~{fragments/header :: header}"></div>
<div th:replace="~{fragments/nav :: nav}"></div>

<main class="app-content">
    <div th:replace="~{fragments/messages :: messages}"></div>

    <div>
        <h1 th:text="${book.title}">Book Title</h1>

        <p>
            <strong>ISBN:</strong>
            <span th:text="${book.ISBN}">ISBN</span>
        </p>

        <p>
            <strong>Description:</strong>
            <span th:text="${book.description}">Description</span>
        </p>

        <p>
            <strong>Publisher:</strong>
            <span th:text="${book.publisher}">Publisher</span>
        </p>

        <p>
            <strong>Publication Year:</strong>
            <span th:text="${book.publicationYear}">Year</span>
        </p>

        <p>
            <strong>Language:</strong>
            <span th:text="${book.language}">Language</span>
        </p>

        <p>
            <strong>Number of pages:</strong>
            <span th:text="${book.numberOfPages}">Pages</span>
        </p>

        <p>
            <strong>Category:</strong>
            <span th:text="${book.category.categoryType}">Category</span>
        </p>

        <p>
            <strong>Status:</strong>
            <span th:text="${book.status}">Status</span>
        </p>

        <p>
            <strong>Authors:</strong>
        </p>

        <ul>
            <li th:each="author : ${book.authors}"
                th:text="${author.lastName}">
                Author
            </li>
        </ul>

        <a th:href="@{/books/{id}/edit(id=${book.id})}">
            <button type="button">Edit</button>
        </a>
        <a th:href="@{/books/{id}/copies(id=${book.id})}">
            <button type="button">Manage Copies</button>
        </a>
    </div>

</main>

<div th:replace="~{fragments/footer :: footer}"></div>

</body>
</html>
