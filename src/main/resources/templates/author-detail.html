<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org" xmlns:sec="http://www.thymeleaf.org/extras/spring-security"><head>
    <meta charset="UTF-8">
    <title>Title</title>
    <link rel="stylesheet" th:href="@{/css/bootstrap.min.css}">
    <link rel="stylesheet" th:href="@{/css/style.css}">
</head>
<body>
<script th:src="@{/js/bootstrap.bundle.min.js}"></script>
<div th:replace="~{fragments/header :: header}"></div>
<main class="app-content">
    <div th:replace="~{fragments/messages :: messages}"></div>
    <div>
        <h1> <span th:text="${author.firstName}">First Name</span> <span th:text="${author.lastName}">Last Name</span></h1>

        <p>
            <strong>Biography:</strong>
            <span th:text="${author.optionalBiography}">Biography</span>
        </p>

        <a th:href="@{/authors/{id}/books(id=${author.id})}" class="text-decoration-none">
            <button type="button" class="btn btn-outline-info">View books</button>
        </a>
        <a th:href="@{/authors/{id}/edit(id=${author.id})}"class="text-decoration-none" sec:authorize="hasRole('ADMINISTRATOR')">
            <button type="button" class="btn btn-outline-info">Edit</button>
        </a>
    </div>
</main>
<div th:replace="~{fragments/footer :: footer}"></div>
</body>
</html>
