<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Title</title>
</head>
<body>
<div th:replace="~{fragments/header :: header}"></div>
<div th:replace="~{fragments/nav :: nav}"></div>
<main class="app-content">
    <div th:replace="~{fragments/messages :: messages}"></div>
    <div>
        <h1> <span th:text="${author.firstName}">First Name</span> <span th:text="${author.lastName}">Last Name</span></h1>

        <p>
            <strong>Biography:</strong>
            <span th:text="${author.optionalBiography}">Biography</span>
        </p>

        <a th:href="@{/authors/{id}/books(id=${author.id})}">
            <button type="button">View books</button>
        </a>
    </div>
</main>
<div th:replace="~{fragments/footer :: footer}"></div>
</body>
</html>
